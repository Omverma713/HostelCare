name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSH key and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Write key using Python to avoid all shell escaping issues
          python3 << 'PYEOF'
          import os, sys, base64

          raw = os.environ.get("EC2_SSH_KEY", "").strip()

          # 1. Try base64 decoding if key is stored as base64 string
          try:
              decoded = base64.b64decode(raw).decode("utf-8", errors="ignore")
              if "PRIVATE KEY" in decoded:
                  raw = decoded
          except Exception:
              pass

          # 2. Fix literal \n strings if raw secret lost true newlines
          if "\\n" in raw and "\n" not in raw:
              raw = raw.replace("\\n", "\n")

          # 3. Clean Windows carriage returns and ensure trailing newline
          key = raw.replace("\r", "").strip() + "\n"

          os.makedirs(os.path.expanduser("~/.ssh"), exist_ok=True)
          key_path = os.path.expanduser("~/.ssh/deploy_key")
          with open(key_path, "w") as f:
              f.write(key)
          os.chmod(key_path, 0o600)

          # Print first and last line to confirm key format safely
          lines = key.strip().split("\n")
          print(f"Key lines: {len(lines)}")
          print(f"First line: {lines[0]}")
          print(f"Last line:  {lines[-1]}")
          sys.stdout.flush()
          PYEOF

          # Verify key is parseable
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo ">>> SSH Key is valid!" || {
            echo "ERROR: Key is not valid. Please verify EC2_SSH_KEY secret."
            exit 1
          }

          # Disable strict host checking and configure keepalive
          cat >> ~/.ssh/config << EOF
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ServerAliveInterval 15
            ServerAliveCountMax 3
            ConnectTimeout 30
          EOF

          # Deploy via SSH with connection timeout protection
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=30 "$EC2_USER@$EC2_HOST" << 'SSHEOF'
          set -e
          cd /home/ubuntu/hostelcare
          echo ">>> Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main
          echo ">>> Rebuilding and restarting Docker container..."
          sudo docker compose down --remove-orphans || true
          sudo docker compose up -d --build
          echo ">>> Waiting for container to initialize..."
          sleep 10
          echo ">>> Performing health check..."
          curl --fail --retry 10 --retry-delay 3 http://localhost:3000/health || {
            echo "❌ Health check failed! Printing container logs:"
            sudo docker compose logs --tail=100
            exit 1
          }
          echo ""
          echo ">>> Deployment successful!"
          SSHEOF
