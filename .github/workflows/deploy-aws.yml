name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: SSH and Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo ">>> Setting up SSH key directory..."
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          python3 -c "
          import os, base64

          raw = os.environ.get('EC2_SSH_KEY', '').strip()

          # Try base64 decoding in case it is base64 encoded
          try:
              decoded = base64.b64decode(raw).decode('utf-8', errors='ignore')
              if 'PRIVATE KEY' in decoded:
                  raw = decoded
          except Exception:
              pass

          # Replace literal '\n' characters with real newlines if needed
          if '\\n' in raw and '\n' not in raw:
              raw = raw.replace('\\n', '\n')

          # Strip Windows carriage returns and ensure trailing newline
          raw = raw.replace('\r', '').strip() + '\n'

          key_path = os.path.expanduser('~/.ssh/id_rsa')
          with open(key_path, 'w') as f:
              f.write(raw)
          "

          chmod 600 ~/.ssh/id_rsa

          echo ">>> Verifying private key with ssh-keygen..."
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          echo ">>> Key verified successfully!"

          echo ">>> Connecting to EC2 ($EC2_USER@$EC2_HOST)..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e
            echo ">>> Navigating to application directory..."
            cd /home/ubuntu/hostelcare

            echo ">>> Pulling latest commit from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo ">>> Rebuilding and restarting Docker container..."
            sudo docker compose down --remove-orphans || true
            sudo docker compose up -d --build

            echo ">>> Waiting for container to initialize..."
            sleep 6

            echo ">>> Performing health check..."
            curl --fail --retry 5 --retry-delay 3 http://localhost:3000/health || {
              echo "Health check failed! Container logs:"
              sudo docker compose logs --tail=50
              exit 1
            }

            echo ">>> Deployment successfully completed!"
          EOF
