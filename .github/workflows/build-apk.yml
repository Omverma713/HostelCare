name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build HostelCare Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            mobile-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Mobile App Dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Build Web & Sync Mobile Assets
        working-directory: mobile-app
        run: npm run build:mobile

      - name: Make Gradlew Executable
        working-directory: mobile-app/android
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        working-directory: mobile-app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HostelCare-app-debug
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
