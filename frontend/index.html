<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Title & Meta -->
    <title>HostelCare — Hostel Management Portal</title>
    <meta name="title" content="HostelCare — Hostel Management Portal" />
    <meta name="description" content="HostelCare — Modern, automated hostel complaint management and resolution tracking portal." />
    <meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#181615" media="(prefers-color-scheme: dark)" />

    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans for Warm Linen Aesthetic -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Favicon & Touch Icons for All Devices & Dimensions (v3 cache-busting) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=3" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=3" />
    <link rel="shortcut icon" href="/favicon.ico?v=3" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

    <!-- Open Graph / WhatsApp / Facebook / Telegram Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hostelcare.omverma-dev.workers.dev" />
    <meta property="og:site_name" content="HostelCare" />
    <meta property="og:title" content="HostelCare — Smart Hostel Life & Dining Portal" />
    <meta property="og:description" content="Real-time meal notifications, weekly menus, fast complaint resolution, and facility care." />
    <meta property="og:image" content="https://hostelcare.omverma-dev.workers.dev/og-image.png?v=3" />
    <meta property="og:image:secure_url" content="https://hostelcare.omverma-dev.workers.dev/og-image.png?v=3" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://hostelcare.omverma-dev.workers.dev" />
    <meta name="twitter:title" content="HostelCare — Smart Hostel Life & Dining Portal" />
    <meta name="twitter:description" content="Real-time meal notifications, weekly menus, fast complaint resolution, and facility care." />
    <meta name="twitter:image" content="https://hostelcare.omverma-dev.workers.dev/og-image.png?v=3" />
  </head>
  <body>
    <div id="root">
      <style>
        #hc-initial-boot-splash {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #FAF7F2;
          color: #242523;
          font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          z-index: 999999;
          user-select: none;
          -webkit-user-select: none;
          transition: opacity 0.3s ease-out;
        }
        @media (prefers-color-scheme: dark) {
          #hc-initial-boot-splash {
            background: #141312;
            color: #F5F2EB;
          }
        }
        .hc-boot-crest-wrap {
          position: relative;
          width: 84px;
          height: 84px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 20px;
          animation: hcPulse 2s ease-in-out infinite;
        }
        .hc-boot-glow-ring {
          position: absolute;
          inset: -10px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(88, 115, 96, 0.22) 0%, rgba(212, 180, 131, 0.1) 60%, transparent 80%);
          filter: blur(8px);
        }
        .hc-boot-crest-svg {
          width: 72px;
          height: 72px;
          filter: drop-shadow(0 4px 12px rgba(36, 37, 35, 0.12));
        }
        .hc-boot-title {
          font-family: 'Playfair Display', Georgia, serif;
          font-size: 26px;
          font-weight: 700;
          letter-spacing: -0.02em;
          margin: 0 0 6px 0;
          text-align: center;
        }
        .hc-boot-subtitle {
          font-size: 12.5px;
          font-weight: 600;
          letter-spacing: 0.08em;
          text-transform: uppercase;
          color: #728D7A;
          margin: 0 0 24px 0;
          text-align: center;
        }
        .hc-boot-progress-track {
          width: 140px;
          height: 3.5px;
          border-radius: 999px;
          background: rgba(114, 141, 122, 0.18);
          overflow: hidden;
          position: relative;
        }
        .hc-boot-progress-bar {
          position: absolute;
          top: 0;
          bottom: 0;
          left: -40%;
          width: 40%;
          border-radius: 999px;
          background: linear-gradient(90deg, #728D7A 0%, #D4B483 100%);
          animation: hcShimmer 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes hcPulse {
          0%, 100% { transform: scale(1); opacity: 1; }
          50% { transform: scale(1.04); opacity: 0.88; }
        }
        @keyframes hcShimmer {
          0% { left: -40%; width: 40%; }
          50% { width: 60%; }
          100% { left: 100%; width: 30%; }
        }
      </style>
      <div id="hc-initial-boot-splash">
        <div class="hc-boot-crest-wrap">
          <div class="hc-boot-glow-ring"></div>
          <svg class="hc-boot-crest-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" rx="24" fill="#587360"/>
            <path d="M50 18L76 28V48C76 66 65 79 50 84C35 79 24 66 24 48V28L50 18Z" fill="#FAF7F2" fill-opacity="0.95"/>
            <path d="M50 25L70 33V47C70 61 61 72 50 76C39 72 30 61 30 47V33L50 25Z" fill="#587360"/>
            <path d="M44 40H56V60H44V40Z" fill="#D4B483"/>
            <circle cx="50" cy="36" r="4" fill="#D4B483"/>
          </svg>
        </div>
        <h1 class="hc-boot-title">HostelCare</h1>
        <p class="hc-boot-subtitle">Campus Life &amp; Dining</p>
        <div class="hc-boot-progress-track">
          <div class="hc-boot-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
