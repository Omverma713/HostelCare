<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .hc-bg { fill: #FAF7F2; }
      .hc-border { stroke: #C9826D; fill: none; stroke-width: 28; }
      .hc-inner-rim { stroke: #E8D9D0; fill: none; stroke-width: 4; }
      .hc-h { fill: #1A1816; }
      .hc-c { fill: #C9826D; }
      .hc-star { fill: #D98C77; }
      .hc-core { fill: #FAF7F2; }

      @media (prefers-color-scheme: dark) {
        .hc-bg { fill: #181615; }
        .hc-border { stroke: #C9826D; }
        .hc-inner-rim { stroke: #332B27; }
        .hc-h { fill: #FAF7F2; }
        .hc-c { fill: #D98C77; }
        .hc-star { fill: #E5A894; }
        .hc-core { fill: #181615; }
      }
    </style>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="24" y="24" width="464" height="464" rx="116" class="hc-bg"/>
  <rect x="42" y="42" width="428" height="428" rx="98" class="hc-inner-rim"/>
  <rect x="24" y="24" width="464" height="464" rx="116" class="hc-border"/>

  <g transform="translate(6, 0)">
    <!-- Serif Letter 'H' - Left Pillar -->
    <path class="hc-h" d="M 112 142 L 186 142 L 186 160 C 174 160 166 166 166 178 L 166 334 C 166 346 174 352 186 352 L 186 370 L 112 370 L 112 352 C 124 352 132 346 132 334 L 132 178 C 132 166 124 160 112 160 Z"/>
    
    <!-- Serif Letter 'H' - Right Pillar -->
    <path class="hc-h" d="M 244 142 L 318 142 L 318 160 C 306 160 298 166 298 178 L 298 334 C 298 346 306 352 318 352 L 318 370 L 244 370 L 244 352 C 256 352 264 346 264 334 L 264 178 C 264 166 256 160 244 160 Z"/>

    <!-- Crossbar of H -->
    <rect x="156" y="238" width="118" height="36" class="hc-h" rx="2"/>

    <!-- Interlocking Serif Letter 'C' in Terracotta -->
    <path class="hc-c" d="M 390 188 C 368 152 324 144 286 166 C 246 189 226 238 238 288 C 250 338 296 368 344 364 C 374 361 398 342 408 318 L 378 308 C 368 322 352 332 332 330 C 300 328 274 298 270 262 C 266 226 288 194 322 188 C 344 184 366 194 378 208 Z"/>

    <!-- 4-Point Care Sparkle Star -->
    <path class="hc-star" d="M 406 130 Q 406 146 422 146 Q 406 146 406 162 Q 406 146 390 146 Q 406 146 406 130 Z"/>
    <circle cx="406" cy="146" r="3" class="hc-core"/>
  </g>
</svg>
