<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="hcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Tile -->
  <rect width="64" height="64" rx="16" fill="url(#hcGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- Hostel Building & Roof -->
  <path d="M32 13 L49 26 L44 26 L44 48 C44 49.5 42.8 51 41 51 L23 51 C21.2 51 20 49.5 20 48 L20 26 L15 26 Z" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Door / Arch with Gradient -->
  <path d="M28 51 L28 38 C28 35.8 29.8 34 32 34 C34.2 34 36 35.8 36 38 L36 51 Z" fill="url(#hcGrad)"/>

  <!-- Windows -->
